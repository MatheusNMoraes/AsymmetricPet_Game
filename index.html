<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <link rel="icon" type="image/png" href="assets/images/optimized/logo.png">
    <link rel="preload" as="image" href="assets/images/optimized/logo.png" fetchpriority="high">
    <title>Asymmetric Pet</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <main class="game-shell" aria-label="Dog Jump">
        <canvas id="gameCanvas" width="400" height="600" aria-label="Jogo Dog Jump"></canvas>

        <section class="menu-screen" id="menuScreen" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
            <div class="menu-content">
                <img class="menu-logo-image" src="assets/images/optimized/logo.png" alt="Logo do jogo" decoding="async" fetchpriority="high">
                <h1 class="menu-title" id="menuTitle">Asymmetric Pet</h1>
                <p class="menu-subtitle">Dog Jump</p>
                <button class="start-button" id="startButton" type="button">Jogar</button>
            </div>
        </section>

        <section class="hud" aria-label="Progresso da partida">
            <div class="hud-card">
                <span class="hud-label">Camisetas</span>
                <span class="hud-value" id="shirtsValue">0/6</span>
                <div class="shirt-progress" role="progressbar" aria-label="Camisetas coletadas" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
                    <div class="shirt-progress-fill" id="shirtProgress"></div>
                </div>
            </div>
            <div class="hud-card">
                <span class="hud-label">Altura</span>
                <span class="hud-value"><span id="heightValue">0</span> m</span>
            </div>
        </section>

        <p class="controls-hint" id="controlsHint">Toque à esquerda ou à direita para mover</p>
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">Som: ligado</button>
        <p class="collect-toast" id="collectToast" role="status" aria-live="polite" hidden>Camiseta coletada!</p>

        <section class="end-screen" id="endScreen" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
            <div class="end-card">
                <h1 class="end-title" id="endTitle">Fim de jogo</h1>
                <p class="end-message" id="endMessage"></p>
                <p class="final-score">Sua altura final<strong><span id="finalScore">0</span> m</strong></p>
                <button class="restart-button" id="restartButton" type="button">Jogar novamente</button>
            </div>
        </section>
    </main>

    <script src="js/game.js"></script>
</body>
</html>
